<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constructora Valencia — Reformas y multiservicios en Andorra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F5F2;
    --surface:#FFFFFF;
    --surface-2:#EFEDE7;
    --ink:#22303A;
    --ink-soft:#5B6B70;
    --deep:#2B3A42;
    --sage:#7C9885;
    --sage-dark:#5E7A67;
    --stone:#C9A66B;
    --stone-dark:#A9803F;
    --urgent:#B5542D;
    --border:#DEDAD0;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter', sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Archivo', sans-serif; font-weight:700; letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  .wrap{max-width:1160px; margin:0 auto; padding:0 32px;}
  section{padding:96px 0;}
  @media(max-width:720px){ section{padding:64px 0;} .wrap{padding:0 20px;} }

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(246,245,242,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  .nav{display:flex; align-items:center; justify-content:space-between; padding:18px 32px; max-width:1160px; margin:0 auto;}
  .brand-name{font-family:'Archivo', sans-serif; font-weight:700; font-size:19px; color:var(--deep); letter-spacing:-0.01em;}
  .brand-sub{font-size:10.5px; color:var(--ink-soft); letter-spacing:0.06em; text-transform:uppercase;}
  nav ul{display:flex; gap:32px; list-style:none;}
  nav ul a{font-size:14.5px; font-weight:500; color:var(--ink); transition:color .15s;}
  nav ul a:hover{color:var(--sage-dark);}
  .nav-cta{
    display:flex; align-items:center; gap:8px;
    background:var(--sage-dark); color:#fff;
    padding:10px 18px; border-radius:100px;
    font-size:14px; font-weight:600;
    transition:background .15s;
  }
  .nav-cta:hover{background:#4d6656;}
  @media(max-width:860px){
    nav ul{display:none;}
  }

  /* ---------- Mountain divider ---------- */
  .skyline{width:100%; display:block; height:auto;}
  .skyline path{fill:var(--surface-2);}
  .skyline.flip{transform:scaleY(-1);}

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    padding-top:72px;
    padding-bottom:0;
    overflow:hidden;
  }
  .hero-grid{
    display:grid; grid-template-columns:1.1fr 0.9fr; gap:48px; align-items:center;
    padding-bottom:56px;
  }
  @media(max-width:900px){ .hero-grid{grid-template-columns:1fr;} }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'IBM Plex Mono', monospace; font-size:12.5px; letter-spacing:0.05em;
    color:var(--sage-dark); text-transform:uppercase;
    background:#E7EEE7; border-radius:100px; padding:6px 14px; margin-bottom:20px;
  }
  .eyebrow .dot{width:6px; height:6px; border-radius:50%; background:var(--sage-dark);}
  .hero h1{font-size:clamp(34px, 5vw, 54px); line-height:1.08; color:var(--deep); margin-bottom:20px;}
  .hero h1 .accent{color:var(--stone-dark);}
  .hero p.lead{font-size:17px; color:var(--ink-soft); max-width:480px; margin-bottom:32px;}
  .hero-actions{display:flex; gap:14px; flex-wrap:wrap;}
  .btn{
    display:inline-flex; align-items:center; gap:9px;
    padding:14px 24px; border-radius:10px;
    font-size:15px; font-weight:600;
    transition:transform .15s, box-shadow .15s;
    border:1.5px solid transparent;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{background:var(--deep); color:#fff;}
  .btn-primary:hover{box-shadow:0 8px 20px rgba(43,58,66,0.25);}
  .btn-outline{background:transparent; color:var(--deep); border-color:var(--border);}
  .btn-outline:hover{border-color:var(--deep);}
  .hero-stats{display:flex; gap:36px; margin-top:48px; flex-wrap:wrap;}
  .hero-stat .num{font-family:'Archivo', sans-serif; font-weight:800; font-size:30px; color:var(--deep);}
  .hero-stat .lab{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}

  .hero-art{
    background:linear-gradient(180deg, #E9EEEA 0%, #DCE5DE 100%);
    border-radius:20px;
    position:relative;
    overflow:hidden;
    aspect-ratio:4/5;
  }
  .hero-art svg{position:absolute; inset:0; width:100%; height:100%;}

  /* ---------- Quiénes somos ---------- */
  .about{background:var(--surface);}
  .about-grid{display:grid; grid-template-columns:0.9fr 1.1fr; gap:56px; align-items:start;}
  @media(max-width:900px){ .about-grid{grid-template-columns:1fr;} }
  .section-tag{
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--stone-dark); margin-bottom:14px; display:block;
  }
  .about h2{font-size:clamp(26px,3.4vw,36px); color:var(--deep); margin-bottom:18px;}
  .about p{color:var(--ink-soft); margin-bottom:16px; max-width:520px;}
  .pillars{display:grid; grid-template-columns:1fr 1fr; gap:24px;}
  @media(max-width:560px){ .pillars{grid-template-columns:1fr;} }
  .pillar{
    background:var(--bg); border:1px solid var(--border); border-radius:var(--radius);
    padding:24px;
  }
  .pillar-icon{
    width:38px; height:38px; border-radius:9px;
    background:#E7EEE7; display:flex; align-items:center; justify-content:center;
    margin-bottom:14px;
  }
  .pillar h3{font-size:16px; color:var(--deep); margin-bottom:6px;}
  .pillar p{font-size:13.5px; margin-bottom:0;}

  /* ---------- Servicios ---------- */
  .services{background:var(--bg);}
  .section-head{max-width:600px; margin-bottom:52px;}
  .section-head h2{font-size:clamp(26px,3.4vw,36px); color:var(--deep); margin-bottom:14px;}
  .section-head p{color:var(--ink-soft);}
  .service-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:24px;
  }
  @media(max-width:900px){ .service-grid{grid-template-columns:repeat(2,1fr);} }
  @media(max-width:600px){ .service-grid{grid-template-columns:1fr;} }
  .service-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:28px; transition:border-color .15s, transform .15s;
  }
  .service-card:hover{border-color:var(--sage-dark); transform:translateY(-3px);}
  .service-icon{
    width:52px; height:52px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:18px;
  }
  .service-card h3{font-size:17.5px; color:var(--deep); margin-bottom:8px;}
  .service-card p{font-size:14px; color:var(--ink-soft); margin-bottom:14px;}
  .service-tag{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:11.5px;
    color:var(--sage-dark); background:#E7EEE7; padding:4px 10px; border-radius:100px;
  }
  .service-tag.urgent{color:var(--urgent); background:#F5E3DB;}

  /* ---------- Contacto ---------- */
  .contact{background:var(--surface);}
  .contact-grid{display:grid; grid-template-columns:1fr 1fr; gap:56px; align-items:flex-start;}
  @media(max-width:900px){ .contact-grid{grid-template-columns:1fr;} }
  .contact-info h2{font-size:clamp(26px,3.4vw,34px); color:var(--deep); margin-bottom:16px;}
  .contact-info p{color:var(--ink-soft); margin-bottom:28px; max-width:440px;}
  .contact-channels{display:flex; flex-direction:column; gap:14px; margin-bottom:36px;}
  .channel{
    display:flex; align-items:center; gap:14px;
    padding:16px 18px; border:1px solid var(--border); border-radius:12px;
    transition:border-color .15s;
  }
  .channel:hover{border-color:var(--sage-dark);}
  .channel-icon{
    width:40px; height:40px; border-radius:10px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .channel-label{font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em;}
  .channel-value{font-size:15px; font-weight:600; color:var(--deep); font-family:'IBM Plex Mono', monospace;}

  .form-card{
    background:var(--bg); border:1px solid var(--border); border-radius:20px; padding:36px;
  }
  .field{margin-bottom:18px;}
  .field label{display:block; font-size:13px; font-weight:600; color:var(--deep); margin-bottom:7px;}
  .field input, .field textarea, .field select{
    width:100%; padding:12px 14px; border-radius:9px; border:1.5px solid var(--border);
    background:var(--surface); font-family:'Inter', sans-serif; font-size:14.5px; color:var(--ink);
  }
  .field input:focus, .field textarea:focus, .field select:focus{
    outline:none; border-color:var(--sage-dark);
  }
  .field textarea{resize:vertical; min-height:90px;}
  .urgency-options{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  @media(max-width:480px){ .urgency-options{grid-template-columns:repeat(2,1fr);} }
  .urgency-opt{
    cursor:pointer; text-align:center; padding:10px 6px; border-radius:9px;
    border:1.5px solid var(--border); font-size:12.5px; font-weight:600; color:var(--ink-soft);
    transition:all .15s; background:var(--surface);
  }
  .urgency-opt input{display:none;}
  .urgency-opt.active{border-color:var(--sage-dark); background:#E7EEE7; color:var(--sage-dark);}
  .urgency-opt.active[data-level="urgente"]{border-color:var(--urgent); background:#F5E3DB; color:var(--urgent);}

  .estimator{
    margin-top:22px; padding:20px; border-radius:14px; background:var(--surface);
    border:1.5px solid var(--border);
  }
  .estimator-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px;}
  .estimator-top span{font-size:12px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); font-family:'IBM Plex Mono', monospace;}
  #est-time{font-family:'Archivo', sans-serif; font-weight:800; font-size:20px; color:var(--deep); transition:color .2s;}
  .gauge-track{
    position:relative; height:8px; background:var(--surface-2); border-radius:100px; overflow:hidden; margin-bottom:10px;
  }
  .gauge-fill{
    position:absolute; left:0; top:0; height:100%; border-radius:100px;
    background:var(--sage-dark); width:100%;
    transition:width .35s ease, background .35s ease;
  }
  #est-desc{font-size:13px; color:var(--ink-soft);}

  .submit-btn{
    width:100%; margin-top:22px; padding:15px; border:none; border-radius:10px;
    background:var(--deep); color:#fff; font-size:15px; font-weight:600; cursor:pointer;
    transition:background .15s;
  }
  .submit-btn:hover{background:#1b262c;}
  .submit-btn:disabled{background:#a0aab0; cursor:not-allowed;}

  /* Feedback de envío */
  #form-response{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    font-size:14px;
    text-align:center;
    font-weight:600;
  }
  #form-response.success{
    background:#E7EEE7;
    color:var(--sage-dark);
    border:1px solid var(--sage-dark);
  }
  #form-response.error{
    background:#F5E3DB;
    color:var(--urgent);
    border:1px solid var(--urgent);
  }

  /* ---------- Footer ---------- */
  footer{background:var(--deep); color:#DCE3E0; padding-top:0;}
  .footer-inner{padding:56px 0 32px; display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:40px;}
  @media(max-width:720px){ .footer-inner{grid-template-columns:1fr; gap:32px;} }
  footer h4{font-size:13px; text-transform:uppercase; letter-spacing:0.05em; color:#9FB0AB; margin-bottom:16px; font-weight:600;}
  footer p{color:#B8C4C0; font-size:14px; max-width:320px; margin-bottom:8px;}
  footer ul{list-style:none;}
  footer ul li{margin-bottom:10px; font-size:14.5px;}
  footer ul a:hover{color:#fff;}
  .footer-bottom{
    border-top:1px solid rgba(255,255,255,0.12); padding:20px 0; text-align:center;
    font-size:12.5px; color:#8CA098;
  }

  .float-wa{
    position:fixed; bottom:24px; right:24px; z-index:60;
    width:56px; height:56px; border-radius:50%; background:#5E7A67;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 24px rgba(43,58,66,0.3);
    transition:transform .15s;
  }
  .float-wa:hover{transform:scale(1.06);}
</style>
</head>
